# Render Blueprint — CornerLab
#
# Declara a infraestrutura do projeto como código. O ponto crítico aqui são os dois
# Cron Jobs: sem eles, o banco para no tempo (foi exatamente o que aconteceu — a
# última sincronização ficou parada em 01/08 e a tabela worker_runs ficou vazia,
# porque nada disparava o cmd/worker automaticamente).
#
# Por que Cron Job e não Background Worker: o binário cmd/worker aceita
# SYNC_RUN_ONCE=true, que roda um ciclo completo e sai — encaixa no Cron Job do
# Render (~US$1/mês) em vez de um processo 24h (a partir de US$7/mês). Ver o
# comentário de cabeçalho em backend/cmd/worker/main.go.
#
# COMO APLICAR: no painel do Render, "New +" → "Blueprint" → aponte para este
# repositório. O Render lê este arquivo e cria/atualiza os serviços. Serviços que já
# existem e não estão aqui não são apagados.
#
# ATENÇÃO às variáveis marcadas com sync:false — elas NÃO vêm deste arquivo (segredos
# nunca devem ser versionados). O Render vai pedir o valor de cada uma na primeira
# aplicação do blueprint; use os mesmos valores que já estão configurados hoje no
# serviço da API.

services:
  # API HTTP. Já existe hoje no Render; está declarada aqui para o blueprint ficar
  # completo e reproduzível.
  - type: web
    name: cornerlab-api
    runtime: docker
    dockerfilePath: ./backend/Dockerfile
    dockerContext: ./backend
    plan: starter
    healthCheckPath: /health
    envVars:
      - key: ENVIRONMENT
        value: production
      - key: DATABASE_URL
        sync: false
      - key: JWT_SECRET
        sync: false
      - key: API_FOOTBALL_KEY
        sync: false
      - key: OPENAI_API_KEY
        sync: false
      - key: STRIPE_SECRET_KEY
        sync: false
      - key: STRIPE_WEBHOOK_SECRET
        sync: false
      - key: STRIPE_PRICE_ID
        sync: false
      - key: RESEND_API_KEY
        sync: false
      - key: FRONTEND_URL
        value: https://dsfrcornerlab.com.br

cronJobs:
  # ---------------------------------------------------------------------------
  # Ciclo completo — UMA VEZ POR DIA, de madrugada.
  #
  # Um único disparo faz tudo, na ordem: health check do provedor → descobre jogos
  # novos → finaliza os jogos cuja data já passou → recalcula team_metrics
  # (Analytics Worker) → reexecuta as estratégias ativas (backtest + health + DSFR)
  # → roda a varredura do Discovery Engine (DISCOVERY_RUN=true). Tudo fica
  # registrado em worker_runs, que alimenta o "última sincronização" da tela de
  # Integrações.
  #
  # Por que uma vez por dia e não de hora em hora:
  #  1. O plano gratuito da API-Football tem cota diária E limite por minuto. Rodar
  #     de hora em hora queimava a cota e devolvia 429 (ver o throttle em
  #     internal/integration/sportsdata/apifootball/client.go).
  #  2. Jogo de futebol não muda de placar a cada hora. Um ciclo diário, depois que
  #     as partidas da noite terminaram, já deixa o banco em dia.
  #  3. Menos execução = menos custo de cron no Render.
  #
  # 06:00 UTC = 03:00 em Brasília: horário em que qualquer jogo da véspera
  # (inclusive os das 21h45) já terminou e teve estatística publicada.
  # ---------------------------------------------------------------------------
  - type: cron
    name: cornerlab-worker
    runtime: docker
    dockerfilePath: ./backend/Dockerfile
    dockerContext: ./backend
    schedule: "0 6 * * *" # todo dia às 06:00 UTC = 03:00 BRT
    dockerCommand: /app/worker
    envVars:
      - key: ENVIRONMENT
        value: production
      # Roda um ciclo completo e encerra o processo (modo Cron Job, não Background
      # Worker) — ver o cabeçalho de backend/cmd/worker/main.go.
      - key: SYNC_RUN_ONCE
        value: "true"
      # Liga a varredura de descobertas no mesmo disparo, já que agora só existe
      # uma execução por dia.
      - key: DISCOVERY_RUN
        value: "true"
      - key: DATABASE_URL
        sync: false
      - key: API_FOOTBALL_KEY
        sync: false
      - key: STATISTICS_PROVIDER
        value: api_football
